name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # next build generates .next/types/**, which route handlers' typed
      # params reference — running tsc before build would leave those
      # route types unchecked.
      - run: npx tsc --noEmit
